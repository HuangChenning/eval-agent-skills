<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">eval-agent-skills</title>
  <desc id="desc">提示词、JSONL trace、确定性检查与评测报告之间的关系。</desc>
  <rect width="1200" height="320" rx="28" fill="#F5F7FA"/>
  <path d="M56 70H1144M56 258H1144" stroke="#CBD5E1" stroke-width="2"/>
  <text x="56" y="52" fill="#3D5A80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">CODEX SKILL EVALUATION</text>
  <text x="56" y="126" fill="#1F2937" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="58" font-weight="800">eval-agent-skills</text>
  <text x="56" y="166" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24">用可重复的 trace 与检查，让 skill 改进有据可依。</text>
  <text x="56" y="293" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">PROMPT → TRACE → CHECKS → REPORT</text>
  <g transform="translate(720 78)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
    <rect width="122" height="70" rx="12" fill="#E8EEF5" stroke="#3D5A80" stroke-width="2"/><text x="17" y="42" fill="#3D5A80">PROMPT</text>
    <path d="M134 35H158" stroke="#3D5A80" stroke-width="3"/><path d="M152 27L162 35L152 43" fill="none" stroke="#3D5A80" stroke-width="3"/>
    <rect x="170" width="122" height="70" rx="12" fill="#E8EEF5" stroke="#3D5A80" stroke-width="2"/><text x="189" y="42" fill="#3D5A80">TRACE</text>
    <path d="M304 35H328" stroke="#3D5A80" stroke-width="3"/><path d="M322 27L332 35L322 43" fill="none" stroke="#3D5A80" stroke-width="3"/>
    <rect x="340" width="122" height="70" rx="12" fill="#3D5A80"/><text x="357" y="42" fill="#F8FAFC">CHECKS</text>
    <path d="M231 88V112" stroke="#3D5A80" stroke-width="3"/><path d="M223 106L231 116L239 106" fill="none" stroke="#3D5A80" stroke-width="3"/>
    <rect x="170" y="128" width="122" height="70" rx="12" fill="#FFFFFF" stroke="#3D5A80" stroke-width="2"/><text x="182" y="170" fill="#3D5A80">REPORT</text>
  </g>
